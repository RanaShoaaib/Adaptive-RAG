[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Adaptive retrieval-augmented generation with learned query planning and retrieval strategy selection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "matplotlib",
    "numpy",
    "openai",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "sentence-transformers",
    "torch",
    "tqdm",
    "transformers>=4.56",
    "weaviate-client",
]

[project.optional-dependencies]
training = ["peft", "bitsandbytes"]
dev = ["pytest"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_rag*"]
